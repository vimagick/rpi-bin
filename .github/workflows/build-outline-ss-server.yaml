name: Build outline-ss-server

on:
  workflow_dispatch:
    inputs:
      golang:
        description: 'Golang version'
        required: true
        default: '1.27'
        type: choice
        options:
          - '1.27'
          - '1.23'
      version:
        description: 'tunnel-server version'
        required: true
        default: '1.9.2'

env:
  VERSION: ${{ github.event.inputs.version }}
  USER_ID: vimagick
  GIST_ID: f56a7b1dd250d4e4ccd4da16632c6dde

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: golang:${{ github.event.inputs.golang }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gist files
        run: |
          curl -sSfLO "https://gist.githubusercontent.com/${USER_ID}/${GIST_ID}/raw/private_net.go"
          curl -sSfLO "https://gist.githubusercontent.com/${USER_ID}/${GIST_ID}/raw/tcp.patch"
          ls -la private_net.go tcp.patch

      - name: Download tcp.go
        run: |
          curl -sSfLO "https://github.com/OutlineFoundation/tunnel-server/raw/refs/tags/v${VERSION}/service/tcp.go"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git patch

      - name: Clone source
        run: |
          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/OutlineFoundation/tunnel-server.git \
            tunnel-server

      - name: Apply patch
        working-directory: tunnel-server/service
        run: patch -p1 < "${GITHUB_WORKSPACE}/tcp.patch"

      - name: Replace source files
        run: |
          mv "${GITHUB_WORKSPACE}/private_net.go" tunnel-server/net/
          mv "${GITHUB_WORKSPACE}/tcp.go" tunnel-server/service/

      - name: Build
        working-directory: tunnel-server
        run: |
          set -euo pipefail

          go clean -cache

          mkdir -p "${GITHUB_WORKSPACE}/outline-ss-server_${VERSION}-dev"

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
                go build \
                  -ldflags="-s -w -X main.version=${VERSION}-dev" \
                  -o "${GITHUB_WORKSPACE}/outline-ss-server_${VERSION}-dev/outline-ss-server-${GOOS}-${GOARCH}" \
                  ./cmd/outline-ss-server
            done
          done

      - name: Verify version
        run: ./outline-ss-server_${VERSION}-dev/outline-ss-server-linux-amd64 -version

      - name: Package
        run: tar czf outline-ss-server_${VERSION}-dev.tar.gz outline-ss-server_${VERSION}-dev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: outline-ss-server_${{ env.VERSION }}-dev
          path: outline-ss-server_${{ env.VERSION }}-dev.tar.gz
          retention-days: 30