name: Build blescan

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'blescan version'
        required: true
        default: 'main'
        type: string
      ubuntu_version:
        description: 'Ubuntu runner version'
        required: true
        default: '26.04'
        type: choice
        options:
          - '26.04'
          - '24.04'
          - '22.04'

jobs:
  build-linux:
    name: Build ${{ matrix.arch }} (ubuntu ${{ inputs.ubuntu_version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-${{ inputs.ubuntu_version }}
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-${{ inputs.ubuntu_version }}-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake libdbus-1-dev pkg-config

      - name: Download blescan source
        run: |
          echo "Building blescan ${{ inputs.version }} on ubuntu-${{ inputs.ubuntu_version }}"
          curl -sSL "https://github.com/mikemoraned/blescan/archive/refs/heads/${{ inputs.version }}.tar.gz" | tar xz --strip 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-blescan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-blescan-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/blescan --version

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/blescan \
             dist/blescan-${{ inputs.version }}-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blescan-${{ inputs.version }}-linux-${{ matrix.arch }}
          path: dist/blescan-${{ inputs.version }}-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-macos-arch:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin

    steps:
      - name: Install system dependencies
        run: brew install cmake pkg-config

      - name: Download blescan source
        run: |
          curl -sSL "https://github.com/mikemoraned/blescan/archive/refs/heads/${{ inputs.version }}.tar.gz" | tar xz --strip 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/blescan --version

      - name: Upload per-arch binary
        uses: actions/upload-artifact@v4
        with:
          name: blescan-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/blescan
          if-no-files-found: error

  build-macos-universal:
    name: Build macOS Universal
    runs-on: macos-latest
    needs: build-macos-arch

    steps:
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: blescan-macos-x86_64
          path: binaries/x86_64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: blescan-macos-aarch64
          path: binaries/aarch64

      - name: Combine with lipo
        run: |
          mkdir -p dist
          lipo -create \
            binaries/x86_64/blescan \
            binaries/aarch64/blescan \
            -output dist/blescan-${{ inputs.version }}-macos-universal
          chmod +x dist/blescan-${{ inputs.version }}-macos-universal

      - name: Verify universal binary
        run: |
          file dist/blescan-${{ inputs.version }}-macos-universal
          lipo -info dist/blescan-${{ inputs.version }}-macos-universal
          ./dist/blescan-${{ inputs.version }}-macos-universal --version

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: blescan-${{ inputs.version }}-macos-universal
          path: dist/blescan-${{ inputs.version }}-macos-universal
          if-no-files-found: error
