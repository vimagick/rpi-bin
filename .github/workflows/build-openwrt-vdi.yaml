name: Build openwrt.vdi

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version'
        required: true
        type: choice
        options:
          - 25.12.5
          - 24.10.8
          - 23.05.6
          - 22.03.7
        default: '25.12.5'
      resize_size:
        description: 'Target VDI Size (e.g. 128M, 1G)'
        required: false
        type: string
        default: '128M'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Download OpenWrt x86/64 ext4 image
        run: |
          VERSION="${{ inputs.openwrt_version }}"
          FILE="openwrt-${VERSION}-x86-64-generic-ext4-combined.img.gz"
          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${FILE}"
          echo "Downloading: $URL"
          curl -fL -o "$FILE" "$URL"
          ls -lh "$FILE"

      - name: Decompress image
        run: |
          gunzip -f openwrt-*.img.gz || [ $? -eq 2 ]
          ls -lh openwrt-*.img

      - name: Convert raw image to VDI
        run: |
          qemu-img convert -f raw -O vdi openwrt-*.img openwrt.vdi
          qemu-img info openwrt.vdi

      - name: Resize VDI
        run: |
          SIZE="${{ inputs.resize_size }}"
          echo "Resizing VDI to ${SIZE}"
          qemu-img resize openwrt.vdi "$SIZE"
          qemu-img info openwrt.vdi

      - name: Verify final VDI
        run: |
          echo "=== VDI info ==="
          qemu-img info openwrt.vdi
          echo "=== Actual file size ==="
          ls -lh openwrt.vdi
          du -h openwrt.vdi

      - name: Upload VDI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.openwrt_version }}-vdi
          path: openwrt.vdi
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
