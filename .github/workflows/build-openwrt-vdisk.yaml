name: Build openwrt-vdisk

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version'
        required: true
        type: choice
        options:
          - 25.12.5
          - 24.10.8
          - 23.05.6
          - 22.03.7
        default: '25.12.5'
      resize_size:
        description: 'Virtual Disk Size'
        required: true
        type: string
        default: '128M'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Download OpenWrt x86/64 ext4 image
        run: |
          VERSION="${{ inputs.openwrt_version }}"
          FILE="openwrt-${VERSION}-x86-64-generic-ext4-combined.img.gz"
          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${FILE}"
          echo "Downloading: $URL"
          curl -fL -o "$FILE" "$URL"
          ls -lh "$FILE"

      - name: Decompress image
        run: |
          gunzip -f openwrt-*.img.gz || [ $? -eq 2 ]
          ls -lh openwrt-*.img

      - name: Resize raw image
        run: |
          SIZE="${{ inputs.resize_size }}"
          qemu-img resize openwrt-*.img "$SIZE"
          qemu-img info openwrt-*.img

      - name: Convert raw image to VDI/VMDK
        run: |
          qemu-img convert -f raw -O vdi openwrt-*.img openwrt.vdi
          qemu-img convert -f raw -O vmdk openwrt-*.img openwrt.vmdk

      - name: Verify final VDI/VMDK
        run: |
          echo "=== VDI/VMDK info ==="
          qemu-img info openwrt.vdi
          qemu-img info openwrt.vmdk
          echo "=== Actual file size ==="
          ls -lh openwrt.vdi openwrt.vmdk
          du -h openwrt.vdi openwrt.vmdk

      - name: Upload VDI/VMDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ inputs.openwrt_version }}
          path: |
            openwrt.vdi
            openwrt.vmdk
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
