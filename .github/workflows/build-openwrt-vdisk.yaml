name: Build openwrt-vdisk

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version'
        required: true
        type: choice
        options:
          - 25.12.6
          - 24.10.8
          - 23.05.6
          - 22.03.7
        default: '25.12.6'
      openwrt_target:
        description: 'OpenWrt Target'
        required: true
        type: choice
        options:
          - x86/64
          - armsr/armv8
        default: 'x86/64'
      openwrt_efi:
        description: 'OpenWrt EFI'
        required: true
        type: boolean
        default: false
      resize_size:
        description: 'Virtual Disk Size'
        required: true
        type: string
        default: '128M'

jobs:
  build:
    name: Build OpenWrt-${{ inputs.openwrt_version }}-${{ inputs.openwrt_target }}${{ inputs.openwrt_efi == true && '-efi' || '' }} (${{ inputs.resize_size }})
    runs-on: ubuntu-latest

    steps:
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Download OpenWrt image
        run: |
          set -euo pipefail

          VERSION="${{ inputs.openwrt_version }}"
          TARGET="${{ inputs.openwrt_target }}"
          EFI="${{ inputs.openwrt_efi }}"

          TARGET_DIR="${TARGET%/*}"
          SUB_TARGET="${TARGET#*/}"

          FILE="openwrt-${VERSION}-${TARGET_DIR}-${SUB_TARGET}-generic-ext4-combined"
          [[ "${EFI}" = "true" ]] && FILE="${FILE}-efi"
          FILE="${FILE}.img.gz"

          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET_DIR}/${SUB_TARGET}/${FILE}"
          echo "Downloading: ${URL}"
          curl -fL -o "${FILE}" "${URL}"
          ls -lh "${FILE}"

          echo "TARGET_DIR=${TARGET_DIR}" >> "$GITHUB_ENV"
          echo "SUB_TARGET=${SUB_TARGET}" >> "$GITHUB_ENV"

      - name: Decompress image
        run: |
          gunzip -f openwrt-*.img.gz || [ $? -eq 2 ]
          ls -lh openwrt-*.img

      - name: Resize raw image
        run: |
          SIZE="${{ inputs.resize_size }}"
          qemu-img resize -f raw openwrt-*.img "$SIZE"
          qemu-img info openwrt-*.img

      - name: Convert raw image to VDI/VHDX/VMDK
        run: |
          # For VirtualBox
          qemu-img convert -f raw -O vdi openwrt-*.img openwrt.vdi
          # For VMWare
          qemu-img convert -f raw -O vhdx openwrt-*.img openwrt.vhdx
          # For Hype-V
          qemu-img convert -f raw -O vmdk openwrt-*.img openwrt.vmdk

      - name: Verify final VDI/VMDK
        run: |
          echo "=== File info ==="
          qemu-img info openwrt.vdi
          qemu-img info openwrt.vhdx
          qemu-img info openwrt.vmdk
          echo "=== File size ==="
          ls -lh openwrt.vdi openwrt.vhdx openwrt.vmdk
          du -h openwrt.vdi openwrt.vhdx openwrt.vmdk

      - name: Upload VDI/VMDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ inputs.openwrt_version }}-${{ env.TARGET_DIR }}-${{ env.SUB_TARGET }}${{ inputs.openwrt_efi == true && '-efi' || '' }}
          path: |
            openwrt.vdi
            openwrt.vhdx
            openwrt.vmdk
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
